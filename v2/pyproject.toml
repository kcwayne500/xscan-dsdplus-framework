[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xscan-v2"
version = "2.0.0"
description = "Headless DSDPlus scanner host, recorder, and web console"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "Pillow>=10,<12",
  "psutil>=6,<8",
  "pystray>=0.19,<1",
  "sounddevice>=0.5,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
xscan-v2 = "xscan.__main__:main"

[tool.setuptools]
packages = ["xscan"]
include-package-data = true

[tool.setuptools.package-data]
xscan = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
