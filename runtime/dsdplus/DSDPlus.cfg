; ===== DSDPlus Configuration =====

; === Continuous mixed audio file (output of DSD+) ===
; 0 = off (keeps files small, matches your current behavior)
; Set to 1 if you want a single rolling WAV of EVERYTHING you hear (NXDN+FM with -fa)
Save synthesized audio = 0
Synthesized audio format = wav

; === Per-call recordings (DIGITAL calls only) ===
Record voice calls = 1
Voice call audio format = mp3

; Skip encrypted so you don't save garbled clips
Skip encrypted voice calls = 1

; Optional, keeps filenames tidy (if supported by your build)
Use short per-call filenames = 1

; === Raw input capture (IQ/baseband) ===
; Leave off unless you're debugging or want to re-decode later
Record raw input = 0

; === Event logging ===
Log events = 1
